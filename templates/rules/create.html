{% extends "base.html" %}

{% block title %}Create Rule - Mizzle Autoscaler{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h5>Create New Scaling Rule</h5>
    </div>
    <div class="card-body">
         <form id="ruleForm">
            <div class="mb-3">
                <label for="container_name" class="form-label">Container</label>
                <select class="form-select" id="container_name" name="container_name" required>
                    {% for container in containers %}
                    <option value="{{ container.name }}">{{ container.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-3">
                <label for="metric" class="form-label">Metric</label>
                <select class="form-select" id="metric" name="metric" required>
                    <option value="cpu">CPU Usage</option>
                    <option value="memory">Memory Usage</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="threshold" class="form-label">Threshold (%)</label>
                <input type="number" class="form-control" id="threshold" name="threshold" 
                       min="1" max="100" required>
            </div>
            
            <div class="mb-3">
                <label for="action_type" class="form-label">Action Type</label>
                <select class="form-select" id="action_type" name="action_type" required>
                    <option value="horizontal">Horizontal Scaling</option>
                    <option value="vertical">Vertical Scaling</option>
                </select>
            </div>
            
            <div class="mb-3" id="horizontal-fields">
                <label for="increment" class="form-label">Number of Containers to Add/Remove</label>
                <input type="number" class="form-control" id="increment" name="increment" 
                       min="1" value="1">
            </div>
            
            <div class="mb-3 d-none" id="vertical-fields">
                <div class="row">
                    <div class="col">
                        <label for="cpu_increment" class="form-label">CPU Increment</label>
                        <input type="text" class="form-control" id="cpu_increment" 
                               name="cpu_increment" placeholder="e.g., +1">
                    </div>
                    <div class="col">
                        <label for="memory_increment" class="form-label">Memory Increment</label>
                        <input type="text" class="form-control" id="memory_increment" 
                               name="memory_increment" placeholder="e.g., +1GB">
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="cooldown" class="form-label">Cooldown (seconds)</label>
                <input type="number" class="form-control" id="cooldown" name="cooldown" 
                       min="60" value="300" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Create Rule</button>
        </form>
    </div>
</div>

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('ruleForm');
    const submitButton = form.querySelector('button[type="submit"]');
    let isSubmitted = false;

    // Ensure form submission is handled only once
    form.addEventListener('submit', async function (e) {
        e.preventDefault();

        if (isSubmitted) return;
        isSubmitted = true;
        submitButton.disabled = true;
        submitButton.innerText = 'Submitting...';

        const formData = {
            container_name: document.getElementById('container_name').value,
            metric: document.getElementById('metric').value,
            threshold: parseFloat(document.getElementById('threshold').value),
            action_type: document.getElementById('action_type').value,
            cooldown: parseInt(document.getElementById('cooldown').value)
        };

        if (formData.action_type === 'horizontal') {
            formData.increment = parseInt(document.getElementById('increment').value);
        } else {
            formData.cpu_increment = document.getElementById('cpu_increment').value;
            formData.memory_increment = document.getElementById('memory_increment').value;
        }

        try {
            const response = await fetch('/api/scaling-rules', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || 'Failed to create rule.');
            }

            alert('Rule created successfully!');
            window.location.href = '/rules';
        } catch (err) {
            alert(err.message);
            isSubmitted = false;
            submitButton.disabled = false;
            submitButton.innerText = 'Create Rule';
        }
    });

    // Toggle vertical/horizontal fields
    const actionType = document.getElementById('action_type');
    actionType.addEventListener('change', function () {
        const isHorizontal = this.value === 'horizontal';
        document.getElementById('horizontal-fields').classList.toggle('d-none', !isHorizontal);
        document.getElementById('vertical-fields').classList.toggle('d-none', isHorizontal);
    });

    // Trigger field toggle on load
    actionType.dispatchEvent(new Event('change'));
});
</script>
{% endblock %}
{% endblock %}
